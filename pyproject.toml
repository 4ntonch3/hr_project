[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["**/migrations/*"]
force-exclude = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "ERA",
    "ANN",
    "B",
    "A",
    "C4",
    "ISC",
    "T20",
    "PIE",
    "RET",
    "TID",
    "SIM",
    "I",
    "N",
    "E",
    "W",
    "F"
]

ignore = [
    "A003",
    "ANN101",
    "ANN102",
    "ANN002",
    "ANN003",
    "ANN401",
    "B904",
    "RET504",
    "SIM118"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "TID252"
]

"tests/*" = [
    "S101",
    "ANN",
    "ERA001"
]